[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emotionet"
version = "0.1.0.dev0"
description = "Vietnamese lexical-semantic emotion network and SQLite research API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
features = ["numpy>=1.23"]
ml = ["numpy>=1.23", "torch>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["emotionet*"]
